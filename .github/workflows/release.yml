name: Release

on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          manifest_version="$(node -p 'require("./src/manifest.json").version')"
          expected_tag="v${package_version}"
          tag_sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

          [[ "${package_version}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          [[ "${manifest_version}" == "${package_version}" ]]
          [[ "${GITHUB_REF_NAME}" == "${expected_tag}" ]]
          [[ "${tag_sha}" == "${GITHUB_SHA}" ]]
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check

      - name: Package and verify ZIP
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package.mjs

          archive="release/auto-webmcp-${VERSION}.zip"
          [[ -f "${archive}" ]]
          [[ "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" == "1" ]]
          unzip -tq "${archive}"

          extract_dir="${RUNNER_TEMP}/auto-webmcp-release"
          mkdir -p "${extract_dir}"
          unzip -q "${archive}" -d "${extract_dir}"
          diff -qr dist "${extract_dir}"

          node -e '
            const manifest = require(process.argv[1]);
            if (manifest.version !== process.env.VERSION) process.exit(1);
          ' "${extract_dir}/manifest.json"

          for development_only in background.js dev-reload.js build-stamp.txt; do
            [[ ! -e "${extract_dir}/${development_only}" ]]
          done

          (cd release && sha256sum "$(basename "${archive}")" > SHA256SUMS)
          (cd release && sha256sum -c SHA256SUMS)

      - name: Transfer release files to publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.identity.outputs.version }}
          path: |
            release/auto-webmcp-${{ steps.identity.outputs.version }}.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release

      - name: Verify transferred files
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "release/auto-webmcp-${{ needs.build.outputs.version }}.zip" ]]
          [[ -f release/SHA256SUMS ]]
          (cd release && sha256sum -c SHA256SUMS)

      - name: Attest public release ZIP
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/auto-webmcp-${{ needs.build.outputs.version }}.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            "release/auto-webmcp-${VERSION}.zip#Auto WebMCP ${VERSION}" \
            "release/SHA256SUMS#SHA-256 checksums" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --fail-on-no-commits
